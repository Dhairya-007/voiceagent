[project]
name = "voiceagent"
version = "0.1.0"
description = "Low-latency streaming voice agent: telephony + STT + LLM + TTS, with per-turn latency tracing"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "numpy>=1.26.0",
    # audioop was removed from the stdlib in Python 3.13 (PEP 594).
    # This back-port keeps the mu-law/resample path working there.
    "audioop-lts>=0.2.1; python_version >= '3.13'",
]

[project.optional-dependencies]
# Free local STT. The model (tiny.en, ~75 MB) downloads once, then runs offline.
stt = ["faster-whisper>=1.0.3"]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voiceagent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning"]
testpaths = ["tests"]
